<h1>{{ name() }}</h1>

<dl>
  <td>Nombre:</td>
  <dd>{{ name() }}</dd>

  <td>Edad:</td>
  <dd>{{ age() }}</dd>

  <td>Método:</td>
  <dd>{{ getHeroDescription() }}</dd>
  <dd>{{ getHeroDescription() | uppercase }}</dd>

  <td>Capitalizado:</td>
  <!-- ! Intentar  -->
  <dd> {{ cambiarMayusculas() }} </dd>

  <dd>
    {{ heroDescription() }}
  </dd>
</dl>

<button (click)="changeHero()" class="btn btn-primary mx-2">
  Cambiar nombre
</button>

<button class="btn btn-primary" (click)="cambiarEdad()">Cambiar edad</button>

<button (click)="resetForm()" class="btn btn-primary mx-2">Reset</button>

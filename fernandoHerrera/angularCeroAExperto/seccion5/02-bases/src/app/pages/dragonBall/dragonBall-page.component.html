<h3>
    Dragon ball
</h3>

<hr>

<section class="row">

    <div class="col-12 col-sm-6">

        <h3>
            Agregar: {{ nombre() }}
        </h3>
        <input type="text" 
            class="form-control" 
            placeholder="Nombre"
            [value]="nombre()"
            (input)="nombre.set(txtNombre.value)"
            #txtNombre
        >
        <input type="number" 
            class="form-control mt-2" 
            placeholder="Poder"
            [value]="poder()"
            (input)="poder.set(+txtPoder.value)"
            #txtPoder
        >
        <button (click)="agregarHeroe()" class="mt-2 btn btn-primary">
            Agregar
        </button>
    </div>

    <div class="col-12 col-sm-6">
        <h3>Listado</h3>
        <ul>
            @for (character of characters(); track character.id; let indice = $index) {
                @if(character.power>=100){
                    <li> 
                        <span> {{ indice+1 }} - {{ character.name }}</span> 
                        <strong class="mx-3" [class.text-danger]="character.power>100">{{ character.power }}</strong> 
                    </li>
                }@else {
                    <strong>Personaje no calificado para la misión</strong>
                }
            }
        </ul>

    </div>

</section>

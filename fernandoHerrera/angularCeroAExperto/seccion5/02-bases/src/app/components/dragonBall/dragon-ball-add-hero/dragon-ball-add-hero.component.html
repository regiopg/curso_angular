<h3>
    Agregar: {{ nombre() }}
</h3>
<input type="text" 
    class="form-control" 
    placeholder="Nombre"
    [value]="nombre()"
    (input)="nombre.set(txtNombre.value)"
    #txtNombre
>
<input type="number" 
    class="form-control mt-2" 
    placeholder="Poder"
    [value]="poder()"
    (input)="poder.set(+txtPoder.value)"
    #txtPoder
>
<button (click)="agregarHeroe()" class="mt-2 btn btn-primary">
    Agregar
</button>
